<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TOEFL 2026 Trainer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2318181b'/%3E%3Ctext x='16' y='22.5' font-family='system-ui' font-size='18' font-weight='800' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400..900&display=swap" rel="stylesheet" />
    <script>
      // Applies the saved theme before the first render (no white flash). Same keys as web/src/lib/theme.ts.
      (function () {
        var theme = "light";
        try {
          var m = /^\/u\/([^/]+)/.exec(location.pathname);
          var saved = m ? localStorage.getItem("toefl.theme." + decodeURIComponent(m[1])) : localStorage.getItem("toefl.theme.last");
          if (saved === "dark" || saved === "light") theme = saved;
        } catch (e) {
          /* storage unavailable: light */
        }
        if (theme === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
